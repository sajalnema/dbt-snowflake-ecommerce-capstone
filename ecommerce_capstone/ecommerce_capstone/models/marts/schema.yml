version: 2

models:
  - name: dim_customers
    description: >
      Business-ready customer dimension containing
      customer profile information,
      aggregated order metrics,
      and production metadata.

    columns:
      - name: customer_id
        description: Unique business identifier for a customer.
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer first name.

      - name: last_name
        description: Customer last name.

      - name: email
        description: Customer email address.

      - name: signup_date
        description: Date when the customer registered.

      - name: first_order_date
        description: Date of the customer's first order.

      - name: most_recent_order_date
        description: Date of the customer's latest order.

      - name: total_orders_placed
        description: Number of orders placed by the customer.

      - name: customer_lifetime_value
        description: Total revenue generated by the customer.

      - name: active_customer
        description: Indicates whether the customer has placed at least one order.

      - name: updated_at
        description: Timestamp when this customer profile was generated.

      - name: row_hash
        description: >
          Deterministic MD5 fingerprint used for snapshot
          change detection.

  - name: fact_orders
    description: >
      Transaction-level fact table containing one record per order.

    columns:
      - name: order_id
        description: Unique identifier for each order.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who placed the order.
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_timestamp
        description: Timestamp when the order was placed.

      - name: status
        description: Business status of the order.

      - name: amount
        description: Monetary value of the order.