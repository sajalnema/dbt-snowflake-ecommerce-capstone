version: 2

models:
  - name: int_customer_order_summary
    description: >
      Aggregated customer order metrics used by downstream mart models.

    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null

      - name: first_order_date
        description: Earliest order placed by the customer.

      - name: most_recent_order_date
        description: Latest order placed by the customer.

      - name: total_orders_placed
        description: Total number of completed orders.

      - name: customer_lifetime_value
        description: Total revenue generated by the customer.